<!DOCTYPE html>
<!--
  Workshop Planner – DATAGROUP
  Standalone HTML – direkt im Browser öffnen
-->
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workshop Planner – DATAGROUP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f4f4; }
    input[type=number]::-webkit-inner-spin-button { opacity: 1; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const initialItems = [
      { id: 1, title: "Begrüßung & Zielbild", duration: 15, type: "Intro",        subItems: [], notes: "", referent: "" },
      { id: 2, title: "Ist-Analyse",           duration: 45, type: "Analyse",      subItems: [], notes: "", referent: "" },
      { id: 3, title: "Anforderungen",          duration: 60, type: "Arbeit",       subItems: [], notes: "", referent: "" },
      { id: 4, title: "Zielbild / Lösung",      duration: 60, type: "Entscheidung", subItems: [], notes: "", referent: "" },
      { id: 5, title: "Wrap-up & Next Steps",   duration: 20, type: "Abschluss",    subItems: [], notes: "", referent: "" },
    ];

    const TYPE_STYLES = {
      Intro:        "bg-slate-100 text-slate-700 border-slate-300",
      Analyse:      "bg-blue-100 text-blue-700 border-blue-300",
      Arbeit:       "bg-amber-100 text-amber-700 border-amber-300",
      Entscheidung: "bg-emerald-100 text-emerald-700 border-emerald-300",
      Abschluss:    "bg-violet-100 text-violet-700 border-violet-300",
      Pause:        "bg-rose-100 text-rose-700 border-rose-300",
    };

    const TYPE_PPT_FILL = {
      Intro:        "EEF2F7",
      Analyse:      "DCEBFF",
      Arbeit:       "FFF1CC",
      Entscheidung: "DDF7E8",
      Abschluss:    "EEE7FF",
      Pause:        "FFE0E8",
    };

    const TYPES = Object.keys(TYPE_STYLES);

    // Effektive Dauer: Summe der Unterpunkte, falls vorhanden
    function effectiveDuration(item) {
      if (item.subItems && item.subItems.length > 0)
        return item.subItems.reduce((s, si) => s + Number(si.duration || 0), 0);
      return Number(item.duration || 0);
    }

    function toMinutes(time) {
      const [h, m] = time.split(":").map(Number);
      return h * 60 + m;
    }

    function toTime(minutes) {
      const norm = ((minutes % 1440) + 1440) % 1440;
      return `${String(Math.floor(norm / 60)).padStart(2,"0")}:${String(norm % 60).padStart(2,"0")}`;
    }

    function WorkshopPlanner() {
      const [items, setItems]           = useState(initialItems);
      const [startTime, setStartTime]   = useState("09:00");
      const [targetDuration, setTarget] = useState(240);
      const [workshopTitle, setTitle]   = useState("Workshop Agenda");
      const [customerName, setCustomer] = useState("DATAGROUP");
      const [newTitle, setNewTitle]     = useState("");
      const [newType, setNewType]       = useState("Arbeit");
      const [openNotes, setOpenNotes]   = useState({});

      // Zeitplan berechnen – verwendet effektiveDauer pro Punkt
      const schedule = useMemo(() => {
        let cur = toMinutes(startTime);
        return items.map(item => {
          const dur   = effectiveDuration(item);
          const start = cur;
          const end   = cur + dur;
          cur = end;
          // Unterpunkte mit Zeitstempeln anreichern
          let subCur = start;
          const subItems = (item.subItems || []).map(si => {
            const siStart = subCur;
            const siEnd   = subCur + Number(si.duration || 0);
            subCur = siEnd;
            return { ...si, start: toTime(siStart), end: toTime(siEnd) };
          });
          return { ...item, duration: dur, start: toTime(start), end: toTime(end), subItems };
        });
      }, [items, startTime]);

      const totalMin = useMemo(() => schedule.reduce((s, i) => s + i.duration, 0), [schedule]);
      const variance = totalMin - Number(targetDuration || 0);
      const endTime  = schedule.length ? schedule[schedule.length - 1].end : startTime;

      // ── Hauptpunkt-Aktionen ──────────────────────────────────
      const move = (idx, dir) => {
        const t = idx + dir;
        if (t < 0 || t >= items.length) return;
        const c = [...items];
        [c[idx], c[t]] = [c[t], c[idx]];
        setItems(c);
      };

      const updateItem = (idx, field, val) => {
        const c = [...items];
        c[idx] = { ...c[idx], [field]: field === "duration" ? Math.max(0, Number(val || 0)) : val };
        setItems(c);
      };

      const addItem = () => {
        if (!newTitle.trim()) return;
        setItems(p => [...p, { id: Date.now(), title: newTitle.trim(), duration: 15, type: newType, subItems: [], notes: "", referent: "" }]);
        setNewTitle("");
      };

      const addBreak = () =>
        setItems(p => [...p, { id: Date.now(), title: "Pause", duration: 15, type: "Pause", subItems: [], notes: "", referent: "" }]);

      const toggleNotes = id => setOpenNotes(prev => ({ ...prev, [id]: !prev[id] }));

      const removeItem = idx => setItems(p => p.filter((_, i) => i !== idx));

      // ── Unterpunkt-Aktionen ──────────────────────────────────
      const addSubItem = idx => {
        const c = [...items];
        c[idx] = {
          ...c[idx],
          subItems: [...(c[idx].subItems || []),
            { id: Date.now(), title: "Neuer Unterpunkt", duration: 10, notes: "", referent: "" }
          ]
        };
        setItems(c);
      };

      const updateSubItem = (idx, sIdx, field, val) => {
        const c = [...items];
        const subs = [...(c[idx].subItems || [])];
        subs[sIdx] = { ...subs[sIdx], [field]: field === "duration" ? Math.max(0, Number(val || 0)) : val };
        c[idx] = { ...c[idx], subItems: subs };
        setItems(c);
      };

      const removeSubItem = (idx, sIdx) => {
        const c = [...items];
        c[idx] = { ...c[idx], subItems: c[idx].subItems.filter((_, i) => i !== sIdx) };
        setItems(c);
      };

      const moveSubItem = (idx, sIdx, dir) => {
        const t = sIdx + dir;
        const subs = [...(items[idx].subItems || [])];
        if (t < 0 || t >= subs.length) return;
        [subs[sIdx], subs[t]] = [subs[t], subs[sIdx]];
        const c = [...items];
        c[idx] = { ...c[idx], subItems: subs };
        setItems(c);
      };

      // ── PowerPoint Export ────────────────────────────────────
      const exportPPT = () => {
        const pptx = new PptxGenJS();
        pptx.defineLayout({ name: "DG", width: 13.333, height: 7.5 });
        pptx.layout = "DG";

        // Titelfolie
        const s1 = pptx.addSlide();
        s1.background = { color: "FFFFFF" };
        s1.addShape(pptx.ShapeType.rect, { x:0, y:0,    w:13.333, h:0.45, fill:{color:"E30613"}, line:{color:"E30613"} });
        s1.addShape(pptx.ShapeType.rect, { x:0, y:7.05, w:13.333, h:0.45, fill:{color:"E30613"}, line:{color:"E30613"} });
        s1.addText("DATAGROUP",  { x:0.4, y:0.02, w:4,  fontSize:14, bold:true, color:"FFFFFF" });
        s1.addText(workshopTitle,{ x:1.5, y:2.5,  w:10, fontSize:36, bold:true, color:"1A1A1A", align:"center" });
        s1.addText(customerName, { x:1.5, y:3.5,  w:10, fontSize:22, color:"E30613", align:"center" });
        s1.addText(new Date().toLocaleDateString("de-DE"), { x:1.5, y:4.2, w:10, fontSize:14, color:"666666", align:"center" });

        // Agenda-Folie
        const s2 = pptx.addSlide();
        s2.background = { color: "FFFFFF" };
        s2.addShape(pptx.ShapeType.rect, { x:0, y:0,    w:13.333, h:0.45, fill:{color:"E30613"}, line:{color:"E30613"} });
        s2.addShape(pptx.ShapeType.rect, { x:0, y:7.05, w:13.333, h:0.45, fill:{color:"E30613"}, line:{color:"E30613"} });
        s2.addText("DATAGROUP", { x:0.4, y:0.02, w:4, fontSize:14, bold:true, color:"FFFFFF" });
        s2.addText("Agenda",    { x:0.5, y:0.65, w:12, fontSize:24, bold:true, color:"1A1A1A" });
        s2.addText(`${startTime} – ${endTime} Uhr  |  ${totalMin} Min`, { x:0.5, y:1.1, w:12, fontSize:12, color:"666666" });

        const rows = [[
          { text:"Zeit",     options:{ bold:true, fill:{color:"1A1A1A"}, color:"FFFFFF" } },
          { text:"Inhalt",   options:{ bold:true, fill:{color:"1A1A1A"}, color:"FFFFFF" } },
          { text:"Referent", options:{ bold:true, fill:{color:"1A1A1A"}, color:"FFFFFF" } },
          { text:"Typ",      options:{ bold:true, fill:{color:"1A1A1A"}, color:"FFFFFF" } },
          { text:"Min",      options:{ bold:true, fill:{color:"1A1A1A"}, color:"FFFFFF", align:"center" } },
        ]];

        schedule.forEach(item => {
          const fill = TYPE_PPT_FILL[item.type] || "FFFFFF";
          rows.push([
            { text:`${item.start}–${item.end}`,  options:{ fill:{color:fill}, bold:true } },
            { text: item.title,                   options:{ fill:{color:fill}, bold:true } },
            { text: item.referent || "",          options:{ fill:{color:fill} } },
            { text: item.type,                    options:{ fill:{color:fill}, bold:true } },
            { text: String(item.duration),        options:{ fill:{color:fill}, bold:true, align:"center" } },
          ]);
          // Unterpunkte eingerückt
          (item.subItems || []).forEach(si => {
            rows.push([
              { text:`${si.start}–${si.end}`,  options:{ fill:{color:"FAFAFA"}, color:"555555", fontSize:11 } },
              { text:`   ↳ ${si.title}`,        options:{ fill:{color:"FAFAFA"}, color:"555555", fontSize:11 } },
              { text: si.referent || "",        options:{ fill:{color:"FAFAFA"}, color:"555555", fontSize:11 } },
              { text:"",                        options:{ fill:{color:"FAFAFA"} } },
              { text: String(si.duration),      options:{ fill:{color:"FAFAFA"}, color:"555555", fontSize:11, align:"center" } },
            ]);
          });
        });

        s2.addTable(rows, {
          x:0.5, y:1.5, w:12.3,
          colW:[2.0, 5.2, 2.2, 1.8, 1.1],
          border:{ pt:1, color:"DDDDDD" },
          fontSize:13,
          rowH:0.4,
        });

        pptx.writeFile({ fileName: `${customerName}_${workshopTitle.replace(/\s+/g,"_")}.pptx` });
      };

      const varColor = variance === 0 ? "text-emerald-600" : variance > 0 ? "text-red-600" : "text-amber-600";
      const varLabel = variance === 0 ? "Exakt geplant" : variance > 0 ? `+${variance} Min zu lang` : `${variance} Min Puffer`;

      return (
        <div className="min-h-screen bg-gray-100">

          {/* Header */}
          <div className="bg-red-600 text-white px-6 py-4 flex items-center justify-between shadow">
            <div>
              <p className="text-xs font-bold uppercase tracking-widest opacity-80">DATAGROUP</p>
              <h1 className="text-2xl font-bold">Workshop Planner</h1>
            </div>
            <button onClick={exportPPT}
              className="bg-white text-red-600 font-bold px-5 py-2 rounded-lg shadow hover:bg-red-50 transition text-sm">
              ↓ PowerPoint exportieren
            </button>
          </div>

          <div className="max-w-3xl mx-auto p-6 grid gap-4">

            {/* Einstellungen */}
            <div className="bg-white rounded-xl shadow p-5 grid grid-cols-2 gap-4">
              <div>
                <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Workshop-Titel</label>
                <input value={workshopTitle} onChange={e => setTitle(e.target.value)}
                  className="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-400" />
              </div>
              <div>
                <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Kunde / Organisation</label>
                <input value={customerName} onChange={e => setCustomer(e.target.value)}
                  className="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-400" />
              </div>
              <div>
                <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Startzeit</label>
                <input type="time" value={startTime} onChange={e => setStartTime(e.target.value)}
                  className="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-400" />
              </div>
              <div>
                <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Zieldauer (Minuten)</label>
                <input type="number" value={targetDuration} onChange={e => setTarget(e.target.value)}
                  className="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-400" />
              </div>
            </div>

            {/* Status-Bar */}
            <div className="bg-white rounded-xl shadow px-5 py-3 flex items-center justify-between text-sm">
              <span className="text-gray-500">
                Geplant: <strong>{totalMin} Min</strong> &nbsp;|&nbsp; Ende: <strong>{endTime} Uhr</strong>
              </span>
              <span className={`font-bold ${varColor}`}>{varLabel}</span>
            </div>

            {/* Agenda-Punkte */}
            {schedule.map((item, idx) => {
              const hasSubItems = item.subItems && item.subItems.length > 0;
              return (
                <div key={item.id} className="bg-white rounded-xl shadow overflow-hidden">

                  {/* Hauptpunkt */}
                  <div className="p-4 grid gap-3">
                    <div className="flex items-center gap-3">
                      <span className="text-gray-400 font-bold text-sm w-5 text-center">{idx + 1}</span>
                      <input value={item.title} onChange={e => updateItem(idx, "title", e.target.value)}
                        className="flex-1 border rounded-lg px-3 py-1.5 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-red-400" />
                      <input value={item.referent} onChange={e => updateItem(idx, "referent", e.target.value)}
                        placeholder="Referent"
                        className="w-32 border rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-400 text-gray-600" />
                      <select value={item.type} onChange={e => updateItem(idx, "type", e.target.value)}
                        className={`border rounded-lg px-2 py-1.5 text-xs font-semibold focus:outline-none ${TYPE_STYLES[item.type] || ""}`}>
                        {TYPES.map(t => <option key={t} value={t}>{t}</option>)}
                      </select>
                    </div>

                    <div className="flex items-center gap-3 pl-8">
                      <span className="text-gray-500 text-sm w-32">⏱ {item.start} – {item.end}</span>

                      {/* Dauer: gesperrt wenn Unterpunkte vorhanden */}
                      {hasSubItems ? (
                        <span className="w-20 border rounded-lg px-2 py-1.5 text-sm text-center bg-gray-50 text-gray-400 font-bold">
                          {item.duration}
                        </span>
                      ) : (
                        <input type="number" value={item.duration}
                          onChange={e => updateItem(idx, "duration", e.target.value)}
                          className="w-20 border rounded-lg px-2 py-1.5 text-sm text-center focus:outline-none focus:ring-2 focus:ring-red-400" />
                      )}
                      <span className="text-gray-400 text-sm">Min{hasSubItems && <span className="text-xs ml-1 text-blue-400">(Σ)</span>}</span>

                      <div className="ml-auto flex gap-1">
                        <button onClick={() => addSubItem(idx)} title="Unterpunkt hinzufügen"
                          className="h-8 px-2 rounded-lg border border-blue-200 text-blue-500 hover:bg-blue-50 transition text-xs font-bold">
                          + Sub
                        </button>
                        <button onClick={() => toggleNotes(item.id)} title="Notizen ein-/ausblenden"
                          className={`h-8 px-2 rounded-lg border text-xs font-bold transition ${openNotes[item.id] || item.notes ? "border-yellow-300 text-yellow-600 bg-yellow-50" : "border-gray-200 text-gray-400 hover:bg-gray-50"}`}>
                          📝{item.notes ? " ●" : ""}
                        </button>
                        <button onClick={() => move(idx, -1)} disabled={idx === 0}
                          className="w-8 h-8 rounded-lg border text-gray-500 hover:bg-gray-100 disabled:opacity-30 transition">↑</button>
                        <button onClick={() => move(idx, 1)} disabled={idx === schedule.length - 1}
                          className="w-8 h-8 rounded-lg border text-gray-500 hover:bg-gray-100 disabled:opacity-30 transition">↓</button>
                        <button onClick={() => removeItem(idx)}
                          className="w-8 h-8 rounded-lg border border-red-200 text-red-400 hover:bg-red-50 transition">✕</button>
                      </div>
                    </div>
                  </div>

                  {/* Notizen */}
                  {openNotes[item.id] && (
                    <div className="border-t border-yellow-100 bg-yellow-50 px-4 py-3">
                      <label className="block text-xs font-semibold text-yellow-600 uppercase tracking-wide mb-1">📝 Notizen</label>
                      <textarea
                        value={item.notes}
                        onChange={e => updateItem(idx, "notes", e.target.value)}
                        placeholder="Hinweise, Fragen, Vorbereitung..."
                        rows={3}
                        className="w-full border border-yellow-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-300 bg-white resize-y"
                      />
                    </div>
                  )}

                  {/* Unterpunkte */}
                  {hasSubItems && (
                    <div className="border-t border-gray-100 bg-gray-50 px-4 py-3 grid gap-2">
                      {item.subItems.map((si, sIdx) => (
                        <div key={si.id}>
                          <div className="flex items-center gap-2 pl-6">
                            <span className="text-gray-300 text-sm">↳</span>
                            <input value={si.title} onChange={e => updateSubItem(idx, sIdx, "title", e.target.value)}
                              className="flex-1 border rounded-lg px-3 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300 bg-white" />
                            <input value={si.referent || ""} onChange={e => updateSubItem(idx, sIdx, "referent", e.target.value)}
                              placeholder="Referent"
                              className="w-24 border rounded-lg px-2 py-1 text-xs focus:outline-none focus:ring-2 focus:ring-blue-300 bg-white text-gray-600" />
                            <span className="text-gray-400 text-xs w-24 text-right">{si.start} – {si.end}</span>
                            <input type="number" value={si.duration}
                              onChange={e => updateSubItem(idx, sIdx, "duration", e.target.value)}
                              className="w-16 border rounded-lg px-2 py-1 text-sm text-center focus:outline-none focus:ring-2 focus:ring-blue-300 bg-white" />
                            <span className="text-gray-400 text-xs">Min</span>
                            <div className="flex gap-1">
                              <button onClick={() => toggleNotes(`sub_${si.id}`)} title="Notizen ein-/ausblenden"
                                className={`w-6 h-6 rounded border text-xs transition ${openNotes[`sub_${si.id}`] || si.notes ? "border-yellow-300 text-yellow-500 bg-yellow-50" : "border-gray-200 text-gray-300 hover:bg-gray-100"}`}>
                                📝
                              </button>
                              <button onClick={() => moveSubItem(idx, sIdx, -1)} disabled={sIdx === 0}
                                className="w-6 h-6 rounded border text-gray-400 hover:bg-gray-200 disabled:opacity-30 text-xs transition">↑</button>
                              <button onClick={() => moveSubItem(idx, sIdx, 1)} disabled={sIdx === item.subItems.length - 1}
                                className="w-6 h-6 rounded border text-gray-400 hover:bg-gray-200 disabled:opacity-30 text-xs transition">↓</button>
                              <button onClick={() => removeSubItem(idx, sIdx)}
                                className="w-6 h-6 rounded border border-red-200 text-red-400 hover:bg-red-50 text-xs transition">✕</button>
                            </div>
                          </div>
                          {openNotes[`sub_${si.id}`] && (
                            <div className="ml-10 mt-1 mb-1">
                              <textarea
                                value={si.notes || ""}
                                onChange={e => updateSubItem(idx, sIdx, "notes", e.target.value)}
                                placeholder="Notizen zum Unterpunkt..."
                                rows={2}
                                className="w-full border border-yellow-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-300 bg-yellow-50 resize-y"
                              />
                            </div>
                          )}
                        </div>
                      ))}

                      {/* Summen-Zeile */}
                      <div className="flex items-center gap-2 pl-6 pt-1 border-t border-gray-200">
                        <span className="flex-1 text-xs text-gray-400 font-semibold uppercase tracking-wide">Gesamt</span>
                        <span className="text-xs text-blue-600 font-bold w-16 text-center">{item.duration} Min</span>
                        <span className="w-6" />
                      </div>
                    </div>
                  )}
                </div>
              );
            })}

            {/* Neuer Hauptpunkt */}
            <div className="bg-white rounded-xl shadow p-4 flex gap-2 items-center">
              <input placeholder="Neuer Agenda-Punkt..."
                value={newTitle} onChange={e => setNewTitle(e.target.value)}
                onKeyDown={e => e.key === "Enter" && addItem()}
                className="flex-1 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-400" />
              <select value={newType} onChange={e => setNewType(e.target.value)}
                className="border rounded-lg px-2 py-2 text-sm focus:outline-none">
                {TYPES.map(t => <option key={t} value={t}>{t}</option>)}
              </select>
              <button onClick={addItem}
                className="bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-red-700 transition">
                + Hinzufügen
              </button>
              <button onClick={addBreak}
                className="border border-gray-300 text-gray-600 px-3 py-2 rounded-lg text-sm hover:bg-gray-50 transition">
                + Pause
              </button>
            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<WorkshopPlanner />);
  </script>
</body>
</html>
